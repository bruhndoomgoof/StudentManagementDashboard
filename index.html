
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management Dashboard</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <div class="dashboard">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <h2>StudentHub</h2>
            </div>

            <ul class="sidebar-menu">
                <li class="active">
                    <i class="fas fa-chart-pie"></i>
                    <span>Dashboard</span>
                </li>

                <li>
                    <i class="fas fa-user-graduate"></i>
                    <span>Students</span>
                </li>
            </ul>

            <div class="sidebar-footer">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </div>
        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- HEADER -->
            <header class="header">
                <div>
                    <h1>Student Dashboard</h1>
                    <p>Manage your student records efficiently.</p>
                </div>

                <div class="profile">
                    <i class="fas fa-user-circle"></i>
                    <span>Administrator</span>
                </div>
            </header>


            <!-- STATISTICS -->
            <section class="stats-container">

                <div class="stat-card">
                    <div class="stat-icon blue">
                        <i class="fas fa-users"></i>
                    </div>

                    <div>
                        <p>Total Students</p>
                        <h2 id="totalStudents">0</h2>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon green">
                        <i class="fas fa-user-plus"></i>
                    </div>

                    <div>
                        <p>New Students</p>
                        <h2 id="newStudents">0</h2>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon orange">
                        <i class="fas fa-book"></i>
                    </div>

                    <div>
                        <p>Courses</p>
                        <h2 id="totalCourses">0</h2>
                    </div>
                </div>

            </section>


            <!-- STUDENT RECORDS -->
            <section class="student-section">

                <div class="section-header">
                    <div>
                        <h2>Student Records</h2>
                        <p>View and manage student information.</p>
                    </div>

                    <button id="addStudentBtn" class="add-btn">
                        <i class="fas fa-plus"></i>
                        Add Student
                    </button>
                </div>


                <!-- SEARCH -->
                <div class="search-container">
                    <i class="fas fa-search"></i>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search students by name, course, or email..."
                    >
                </div>


                <!-- TABLE -->
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Student Name</th>
                                <th>Course</th>
                                <th>Year Level</th>
                                <th>Email</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="studentTableBody">
                            <!-- Student records will appear here -->
                        </tbody>
                    </table>
                </div>

            </section>

        </main>

    </div>


    <!-- ADD / EDIT STUDENT MODAL -->
    <div id="studentModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">
                <h2 id="modalTitle">Add New Student</h2>

                <button id="closeModalBtn" class="close-btn">
                    &times;
                </button>
            </div>

            <form id="studentForm">

                <input type="hidden" id="studentId">

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="course">Course</label>

                    <select id="course" required>
                        <option value="">Select Course</option>
                        <option value="BSIT">BSIT</option>
                        <option value="BSCS">BSCS</option>
                        <option value="BSIS">BSIS</option>
                        <option value="BSEMC">BSEMC</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="year_level">Year Level</label>

                    <select id="year_level" required>
                        <option value="">Select Year Level</option>
                        <option value="1">1st Year</option>
                        <option value="2">2nd Year</option>
                        <option value="3">3rd Year</option>
                        <option value="4">4th Year</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email address"
                        required
                    >
                </div>

                <div class="form-buttons">
                    <button type="button" id="cancelBtn" class="cancel-btn">
                        Cancel
                    </button>

                    <button type="submit" class="save-btn">
                        Save Student
                    </button>
                </div>

            </form>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
